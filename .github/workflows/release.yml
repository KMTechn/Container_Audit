name: Verify frozen Container_Audit release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read
  actions: read

jobs:
  verify-frozen-release:
    runs-on: windows-latest

    steps:
      - name: Checkout exact tag
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Prebind annotated tag object and peel to exact origin main
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $tagRef = "refs/tags/$env:GITHUB_REF_NAME"
          $tagType = (git cat-file -t $tagRef).Trim()
          if ($LASTEXITCODE -ne 0 -or $tagType -cne "tag") {
            throw "Release ref must be an annotated tag object."
          }
          $tagObject = (git rev-parse --verify $tagRef).Trim().ToLowerInvariant()
          $tagCommit = (git rev-parse --verify "$tagRef^{commit}").Trim().ToLowerInvariant()
          $headCommit = (git rev-parse --verify "HEAD^{commit}").Trim().ToLowerInvariant()
          if ($headCommit -cne $tagCommit) {
            throw "Checked-out HEAD differs from the annotated tag peel."
          }
          git fetch --no-tags origin "+refs/heads/main:refs/remotes/origin/main"
          if ($LASTEXITCODE -ne 0) { throw "Failed to fetch authoritative origin/main." }
          $mainCommit = (git rev-parse --verify "refs/remotes/origin/main^{commit}").Trim().ToLowerInvariant()
          if ($tagCommit -cne $mainCommit) {
            throw "Release tag must target exact origin/main. tag=$tagCommit origin/main=$mainCommit"
          }
          "RELEASE_TAG_OBJECT_SHA=$tagObject" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "RELEASE_TAG_COMMIT_SHA=$tagCommit" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Set up verifier Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'

      - name: Bind canonical create-once FINAL tag identity
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $identityJson = python tools/read_release_qualification_tag.py `
            --repository . `
            --tag-ref "refs/tags/$env:GITHUB_REF_NAME" `
            --expected-tag "$env:GITHUB_REF_NAME"
          if ($LASTEXITCODE -ne 0) { throw "Canonical create-once FINAL tag parsing failed." }
          $identity = ConvertFrom-Json -InputObject ($identityJson -join "`n")
          if (
            $identity.tag_object_sha -cne $env:RELEASE_TAG_OBJECT_SHA -or
            $identity.peeled_commit_sha -cne $env:RELEASE_TAG_COMMIT_SHA -or
            $identity.message -cne "Release $env:GITHUB_REF_NAME"
          ) {
            throw "Canonical tag parser disagrees with the prebound create-once object or peel."
          }
          Write-Output "final_tag_identity=PASS tag_object=$($identity.tag_object_sha) peel=$($identity.peeled_commit_sha)"

      - name: Record hosted CI status without release gating
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = "Continue"
          $releaseCommit = $env:RELEASE_TAG_COMMIT_SHA
          $response = gh api --method GET "repos/$env:GITHUB_REPOSITORY/actions/workflows/ci.yml/runs" `
            -f branch=main -f event=push -f head_sha="$releaseCommit" -f per_page=100
          "## Hosted CI observation" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append
          "Release-gate status: **WAIVED_NOT_TESTED** (local exact-SHA gates govern)." | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append
          if ($LASTEXITCODE -ne 0) {
            "Observed status: **UNPROVEN_QUERY_FAILED**." | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append
            Write-Warning "hosted_ci_observation=UNPROVEN_QUERY_FAILED release_gate=WAIVED_NOT_TESTED"
          } else {
            $runs = @((ConvertFrom-Json -InputObject $response).workflow_runs | Where-Object {
              $_.head_sha -ceq $releaseCommit -and $_.head_branch -ceq "main" -and
              $_.event -ceq "push"
            })
            if ($runs.Count -eq 0) {
              "Observed status: **NOT_FOUND**." | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append
              Write-Output "hosted_ci_observation=NOT_FOUND release_gate=WAIVED_NOT_TESTED"
            } else {
              $observed = @($runs | Sort-Object id | ForEach-Object {
                "id=$($_.id),attempt=$($_.run_attempt),status=$($_.status),conclusion=$($_.conclusion)"
              }) -join "; "
              "Observed run(s): $observed" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append
              Write-Output "hosted_ci_observation=$observed release_gate=WAIVED_NOT_TESTED"
            }
          }

      - name: Check release version
        run: python tools/check_release_version.py --tag "${{ github.ref_name }}"

      - name: Wait boundedly for finalized immutable frozen prerelease
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          $ErrorActionPreference = "Stop"
          $apiVersion = "2026-03-10"
          $factoryContractSha256 = "afa1f0e1f4e16421116438fcf998899694186db4c668bfa7fdd7192ede3b3a9a"
          $releaseCommit = $env:RELEASE_TAG_COMMIT_SHA
          $releaseTree = (git rev-parse --verify "$releaseCommit^{tree}").Trim().ToLowerInvariant()
          $zipName = "Container_Audit-$env:RELEASE_TAG.zip"
          $checksumName = "$zipName.sha256"
          $expectedReleaseTitle = "Release $env:RELEASE_TAG"
          $releaseBodyPattern = (
            '\AInternal prerelease; not production-ready\.\n' +
            'Tag: ' + [regex]::Escape($env:RELEASE_TAG) + '\n' +
            'Commit: ' + $releaseCommit + '\n' +
            'Tree: ' + $releaseTree + '\n' +
            'Artifact: ' + [regex]::Escape($zipName) + '\n' +
            'Artifact-SHA256: (?<zip>[0-9a-f]{64})\n' +
            'Artifact-Size: (?<size>[1-9][0-9]*)\n' +
            'Main-EXE-SHA256: (?<exe>[0-9a-f]{64})\n' +
            'Factory-Contract-SHA256: ' + $factoryContractSha256 + '\n' +
            'Hosted-CI-Release-Gate: WAIVED_NOT_TESTED\n' +
            'Status: QUARANTINED_PENDING_FACTORY_QUALIFICATION\z'
          )
          function Read-ReleaseBodyEvidence {
            param([Parameter(Mandatory = $true)][string]$Body)
            $bodyMatch = [regex]::Match($Body, $releaseBodyPattern)
            if (-not $bodyMatch.Success) { return $null }
            try {
              $bodySize = [int64]$bodyMatch.Groups['size'].Value
            } catch {
              return $null
            }
            if ($bodySize -le 0) { return $null }
            return [pscustomobject]@{
              zip_sha256 = $bodyMatch.Groups['zip'].Value
              zip_size = $bodySize
              main_exe_sha256 = $bodyMatch.Groups['exe'].Value
            }
          }
          $maximumAttempts = 180
          $pollSeconds = 10
          $release = $null
          $releaseEvidence = $null
          for ($attempt = 1; $attempt -le $maximumAttempts; $attempt++) {
            $raw = gh api `
              -H "X-GitHub-Api-Version: $apiVersion" `
              "repos/$env:GITHUB_REPOSITORY/releases/tags/$env:RELEASE_TAG" 2>$null
            if ($LASTEXITCODE -eq 0) {
              $candidateRelease = ConvertFrom-Json -InputObject $raw
              $assets = @($candidateRelease.assets)
              $actualReleaseBody = ([string]$candidateRelease.body).Replace("`r`n", "`n")
              $bodyEvidence = Read-ReleaseBodyEvidence -Body $actualReleaseBody
              $releaseTarget = [string]$candidateRelease.target_commitish
              $zipAssets = @($assets | Where-Object { $_.name -ceq $zipName -and $_.state -ceq "uploaded" })
              $checksumAssets = @($assets | Where-Object { $_.name -ceq $checksumName -and $_.state -ceq "uploaded" })
              $assetsReady = (
                $assets.Count -eq 2 -and
                $zipAssets.Count -eq 1 -and
                $checksumAssets.Count -eq 1 -and
                $zipAssets[0].digest -cmatch '^sha256:[0-9a-f]{64}$' -and
                [int64]$zipAssets[0].size -gt 0 -and
                $checksumAssets[0].digest -cmatch '^sha256:[0-9a-f]{64}$' -and
                [int64]$checksumAssets[0].size -gt 0 -and
                $null -ne $bodyEvidence -and
                [int64]$zipAssets[0].size -eq $bodyEvidence.zip_size -and
                $zipAssets[0].digest -ceq "sha256:$($bodyEvidence.zip_sha256)"
              )
              $releaseReady = (
                $candidateRelease.tag_name -ceq $env:RELEASE_TAG -and
                $candidateRelease.name -ceq $expectedReleaseTitle -and
                $null -ne $bodyEvidence -and
                $candidateRelease.draft -eq $false -and
                $candidateRelease.prerelease -eq $true -and
                $candidateRelease.immutable -eq $true -and
                ($releaseTarget -ceq $releaseCommit -or $releaseTarget -ceq "main")
              )
              if ($releaseReady -and $assetsReady) {
                $release = $candidateRelease
                $releaseEvidence = $bodyEvidence
                break
              }
            }
            if ($attempt -lt $maximumAttempts) {
              Write-Output "frozen_asset_wait attempt=$attempt/$maximumAttempts"
              Start-Sleep -Seconds $pollSeconds
            }
          }
          if ($null -eq $release) {
            throw "BLOCKED: exact immutable frozen prerelease was not finalized within 1800 seconds."
          }
          $releaseTarget = [string]$release.target_commitish
          $releaseBody = ([string]$release.body).Replace("`r`n", "`n")
          if ($null -eq $releaseEvidence) {
            throw "BLOCKED: immutable prerelease body does not contain the exact self-consistency record."
          }
          $expectedReleaseBody = @(
            "Internal prerelease; not production-ready."
            "Tag: $env:RELEASE_TAG"
            "Commit: $releaseCommit"
            "Tree: $releaseTree"
            "Artifact: $zipName"
            "Artifact-SHA256: $($releaseEvidence.zip_sha256)"
            "Artifact-Size: $($releaseEvidence.zip_size)"
            "Main-EXE-SHA256: $($releaseEvidence.main_exe_sha256)"
            "Factory-Contract-SHA256: $factoryContractSha256"
            "Hosted-CI-Release-Gate: WAIVED_NOT_TESTED"
            "Status: QUARANTINED_PENDING_FACTORY_QUALIFICATION"
          ) -join "`n"
          if (
            $release.draft -ne $false -or
            $release.prerelease -ne $true -or
            $release.immutable -ne $true -or
            $release.tag_name -cne $env:RELEASE_TAG -or
            $release.name -cne $expectedReleaseTitle -or
            $releaseBody -cne $expectedReleaseBody -or
            ($releaseTarget -cne $env:RELEASE_TAG_COMMIT_SHA -and $releaseTarget -cne "main")
          ) {
            throw "BLOCKED: release identity/status must be the exact finalized immutable prerelease."
          }
          $assetNames = @($release.assets | ForEach-Object { $_.name })
          if ($assetNames.Count -ne 2 -or $assetNames -notcontains $zipName -or $assetNames -notcontains $checksumName) {
            throw "BLOCKED: prerelease must contain exactly the frozen ZIP and checksum assets."
          }
          $zipAsset = $zipAssets[0]
          $checksumAsset = $checksumAssets[0]
          foreach ($asset in @($zipAsset, $checksumAsset)) {
            if ($asset.digest -cnotmatch '^sha256:[0-9a-f]{64}$' -or [int64]$asset.size -le 0) {
              throw "BLOCKED: uploaded asset digest/size metadata is incomplete."
            }
          }
          if (
            [int64]$zipAsset.size -ne $releaseEvidence.zip_size -or
            $zipAsset.digest.Substring(7) -cne $releaseEvidence.zip_sha256
          ) {
            throw "BLOCKED: uploaded ZIP metadata differs from the immutable release body record."
          }
          git fetch --no-tags origin "+refs/heads/main:refs/remotes/origin/main"
          if ($LASTEXITCODE -ne 0) { throw "Unable to refresh authoritative origin/main before download." }
          $remoteMainCommit = (git rev-parse --verify "refs/remotes/origin/main^{commit}").Trim().ToLowerInvariant()
          if ($remoteMainCommit -cne $releaseCommit) {
            throw "BLOCKED: origin/main changed before immutable asset download."
          }
          $snapshotPath = Join-Path $env:RUNNER_TEMP "container-audit-frozen-release-metadata.json"
          if (Test-Path -LiteralPath $snapshotPath) {
            throw "Fresh immutable release snapshot path already exists."
          }
          $snapshot = [ordered]@{
            release_id = $release.id
            tag_name = $release.tag_name
            name = $release.name
            body = $releaseBody
            target_commitish = $release.target_commitish
            draft = $release.draft
            prerelease = $release.prerelease
            immutable = $release.immutable
            assets = @($release.assets | Sort-Object name | ForEach-Object {
              [ordered]@{
                id = $_.id
                name = $_.name
                size = $_.size
                digest = $_.digest
                state = $_.state
              }
            })
          }
          $snapshot | ConvertTo-Json -Depth 6 -Compress | Set-Content `
            -Encoding utf8NoBOM -LiteralPath $snapshotPath
          "FROZEN_RELEASE_ID=$($release.id)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "FROZEN_RELEASE_TARGET=$releaseTarget" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "FROZEN_RELEASE_SNAPSHOT=$snapshotPath" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "FROZEN_ZIP_NAME=$zipName" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "FROZEN_CHECKSUM_NAME=$checksumName" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "FROZEN_ZIP_ASSET_ID=$($zipAsset.id)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "FROZEN_CHECKSUM_ASSET_ID=$($checksumAsset.id)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "FROZEN_ZIP_ASSET_SIZE=$($zipAsset.size)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "FROZEN_CHECKSUM_ASSET_SIZE=$($checksumAsset.size)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "FROZEN_ZIP_ASSET_DIGEST=$($zipAsset.digest.Substring(7))" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "FROZEN_CHECKSUM_ASSET_DIGEST=$($checksumAsset.digest.Substring(7))" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "RELEASE_BODY_ZIP_SHA256=$($releaseEvidence.zip_sha256)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "RELEASE_BODY_ZIP_SIZE=$($releaseEvidence.zip_size)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "RELEASE_BODY_MAIN_EXE_SHA256=$($releaseEvidence.main_exe_sha256)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Download exact frozen assets read-only
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = "Stop"
          $apiVersion = "2026-03-10"
          $downloadRoot = Join-Path $env:RUNNER_TEMP "container-audit-frozen-release"
          if (Test-Path -LiteralPath $downloadRoot) {
            throw "Fresh frozen-release download directory already exists."
          }
          New-Item -ItemType Directory -Path $downloadRoot | Out-Null
          gh release download "${{ github.ref_name }}" `
            --repo "$env:GITHUB_REPOSITORY" `
            --pattern "$env:FROZEN_ZIP_NAME" `
            --pattern "$env:FROZEN_CHECKSUM_NAME" `
            --dir "$downloadRoot"
          if ($LASTEXITCODE -ne 0) { throw "Frozen release asset download failed." }
          $zipPath = Join-Path $downloadRoot $env:FROZEN_ZIP_NAME
          $checksumPath = Join-Path $downloadRoot $env:FROZEN_CHECKSUM_NAME
          $current = gh api `
            -H "X-GitHub-Api-Version: $apiVersion" `
            "repos/$env:GITHUB_REPOSITORY/releases/tags/${{ github.ref_name }}" |
            ConvertFrom-Json
          if ($LASTEXITCODE -ne 0) { throw "Unable to re-read frozen release metadata." }
          $currentBody = ([string]$current.body).Replace("`r`n", "`n")
          $currentSnapshot = [ordered]@{
            release_id = $current.id
            tag_name = $current.tag_name
            name = $current.name
            body = $currentBody
            target_commitish = $current.target_commitish
            draft = $current.draft
            prerelease = $current.prerelease
            immutable = $current.immutable
            assets = @($current.assets | Sort-Object name | ForEach-Object {
              [ordered]@{
                id = $_.id
                name = $_.name
                size = $_.size
                digest = $_.digest
                state = $_.state
              }
            })
          } | ConvertTo-Json -Depth 6 -Compress
          $initialSnapshot = (Get-Content -Raw -Encoding UTF8 -LiteralPath $env:FROZEN_RELEASE_SNAPSHOT).Trim()
          if ($current.immutable -ne $true -or $currentSnapshot -cne $initialSnapshot) {
            throw "BLOCKED: immutable release metadata changed during asset download."
          }
          $currentZip = @($current.assets | Where-Object { $_.name -ceq $env:FROZEN_ZIP_NAME })
          $currentChecksum = @($current.assets | Where-Object { $_.name -ceq $env:FROZEN_CHECKSUM_NAME })
          if (
            $currentZip.Count -ne 1 -or $currentChecksum.Count -ne 1 -or
            [string]$currentZip[0].id -cne $env:FROZEN_ZIP_ASSET_ID -or
            [string]$currentChecksum[0].id -cne $env:FROZEN_CHECKSUM_ASSET_ID
          ) {
            throw "BLOCKED: prerelease assets changed during download."
          }
          $zipInfo = Get-Item -LiteralPath $zipPath
          $checksumInfo = Get-Item -LiteralPath $checksumPath
          $zipDigest = (Get-FileHash -LiteralPath $zipPath -Algorithm SHA256).Hash.ToLowerInvariant()
          $checksumDigest = (Get-FileHash -LiteralPath $checksumPath -Algorithm SHA256).Hash.ToLowerInvariant()
          if (
            $zipInfo.Length -ne [int64]$env:FROZEN_ZIP_ASSET_SIZE -or
            $checksumInfo.Length -ne [int64]$env:FROZEN_CHECKSUM_ASSET_SIZE -or
            $zipDigest -cne $env:FROZEN_ZIP_ASSET_DIGEST -or
            $checksumDigest -cne $env:FROZEN_CHECKSUM_ASSET_DIGEST
          ) {
            throw "BLOCKED: downloaded bytes differ from GitHub asset size/digest metadata."
          }
          $downloadedFiles = @(Get-ChildItem -LiteralPath $downloadRoot -File)
          if ($downloadedFiles.Count -ne 2) {
            throw "BLOCKED: frozen download directory must contain exactly two assets."
          }
          "FROZEN_DOWNLOAD_ROOT=$downloadRoot" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Verify immutable release self-consistency and embedded identities
        shell: pwsh
        env:
          FACTORY_CONTRACT_SHA256: afa1f0e1f4e16421116438fcf998899694186db4c668bfa7fdd7192ede3b3a9a
        run: |
          $ErrorActionPreference = "Stop"
          $releaseCommit = $env:RELEASE_TAG_COMMIT_SHA
          $releaseTree = (git rev-parse --verify "$releaseCommit^{tree}").Trim().ToLowerInvariant()
          $reportPath = Join-Path $env:RUNNER_TEMP "frozen-release-verification.json"
          python tools/verify_frozen_release_artifact.py `
            --zip-path (Join-Path $env:FROZEN_DOWNLOAD_ROOT $env:FROZEN_ZIP_NAME) `
            --checksum-path (Join-Path $env:FROZEN_DOWNLOAD_ROOT $env:FROZEN_CHECKSUM_NAME) `
            --expected-tag "${{ github.ref_name }}" `
            --expected-tag-object $env:RELEASE_TAG_OBJECT_SHA `
            --expected-commit $releaseCommit `
            --expected-tree $releaseTree `
            --expected-contract-sha256 $env:FACTORY_CONTRACT_SHA256 `
            --expected-zip-sha256 $env:RELEASE_BODY_ZIP_SHA256 `
            --expected-zip-size $env:RELEASE_BODY_ZIP_SIZE `
            --expected-main-exe-sha256 $env:RELEASE_BODY_MAIN_EXE_SHA256 `
            --report-path $reportPath
          if ($LASTEXITCODE -ne 0) { throw "Frozen release verification failed." }
          "## Frozen release self-consistency verification" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append
          "Governing comparison with preserved qualified local bytes: **NOT TESTED on hosted runner**." | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append
          '```json' | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append
          Get-Content -Raw -LiteralPath $reportPath | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append
          '```' | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append

      - name: Finally revalidate remote tag main and frozen prerelease
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          $ErrorActionPreference = "Stop"
          $apiVersion = "2026-03-10"
          $rawRemoteRef = gh api `
            -H "X-GitHub-Api-Version: $apiVersion" `
            "repos/$env:GITHUB_REPOSITORY/git/ref/tags/$env:RELEASE_TAG"
          if ($LASTEXITCODE -ne 0) { throw "Unable to re-read the remote release tag ref." }
          $remoteRef = ConvertFrom-Json -InputObject $rawRemoteRef
          if (
            $remoteRef.ref -cne "refs/tags/$env:RELEASE_TAG" -or
            $remoteRef.object.type -cne "tag" -or
            $remoteRef.object.sha -cne $env:RELEASE_TAG_OBJECT_SHA
          ) {
            throw "BLOCKED: remote annotated tag object changed after local verification."
          }

          $rawRemoteTag = gh api `
            -H "X-GitHub-Api-Version: $apiVersion" `
            "repos/$env:GITHUB_REPOSITORY/git/tags/$env:RELEASE_TAG_OBJECT_SHA"
          if ($LASTEXITCODE -ne 0) { throw "Unable to re-read the remote annotated tag object." }
          $remoteTag = ConvertFrom-Json -InputObject $rawRemoteTag
          if (
            $remoteTag.sha -cne $env:RELEASE_TAG_OBJECT_SHA -or
            $remoteTag.tag -cne $env:RELEASE_TAG -or
            $remoteTag.object.type -cne "commit" -or
            $remoteTag.object.sha -cne $env:RELEASE_TAG_COMMIT_SHA
          ) {
            throw "BLOCKED: remote annotated tag peel changed after local verification."
          }

          $rawFinalRelease = gh api `
            -H "X-GitHub-Api-Version: $apiVersion" `
            "repos/$env:GITHUB_REPOSITORY/releases/tags/$env:RELEASE_TAG"
          if ($LASTEXITCODE -ne 0) { throw "Unable to re-read the frozen prerelease." }
          $finalRelease = ConvertFrom-Json -InputObject $rawFinalRelease
          $finalReleaseBody = ([string]$finalRelease.body).Replace("`r`n", "`n")
          if (
            [string]$finalRelease.id -cne $env:FROZEN_RELEASE_ID -or
            $finalRelease.tag_name -cne $env:RELEASE_TAG -or
            $finalRelease.draft -ne $false -or
            $finalRelease.prerelease -ne $true -or
            $finalRelease.immutable -ne $true -or
            $finalRelease.target_commitish -cne $env:FROZEN_RELEASE_TARGET -or
            (
              $finalRelease.target_commitish -cne $env:RELEASE_TAG_COMMIT_SHA -and
              $finalRelease.target_commitish -cne "main"
            )
          ) {
            throw "BLOCKED: frozen immutable prerelease identity/status/target changed after local verification."
          }
          $finalAssets = @($finalRelease.assets)
          $finalZip = @($finalAssets | Where-Object { $_.name -ceq $env:FROZEN_ZIP_NAME })
          $finalChecksum = @($finalAssets | Where-Object { $_.name -ceq $env:FROZEN_CHECKSUM_NAME })
          if ($finalAssets.Count -ne 2 -or $finalZip.Count -ne 1 -or $finalChecksum.Count -ne 1) {
            throw "BLOCKED: frozen prerelease asset membership changed after local verification."
          }
          if (
            $finalZip[0].state -cne "uploaded" -or
            [string]$finalZip[0].id -cne $env:FROZEN_ZIP_ASSET_ID -or
            [int64]$finalZip[0].size -ne [int64]$env:FROZEN_ZIP_ASSET_SIZE -or
            $finalZip[0].digest -cne "sha256:$env:FROZEN_ZIP_ASSET_DIGEST" -or
            $finalChecksum[0].state -cne "uploaded" -or
            [string]$finalChecksum[0].id -cne $env:FROZEN_CHECKSUM_ASSET_ID -or
            [int64]$finalChecksum[0].size -ne [int64]$env:FROZEN_CHECKSUM_ASSET_SIZE -or
            $finalChecksum[0].digest -cne "sha256:$env:FROZEN_CHECKSUM_ASSET_DIGEST"
          ) {
            throw "BLOCKED: frozen prerelease asset IDs/sizes/digests changed after local verification."
          }
          $finalSnapshot = [ordered]@{
            release_id = $finalRelease.id
            tag_name = $finalRelease.tag_name
            name = $finalRelease.name
            body = $finalReleaseBody
            target_commitish = $finalRelease.target_commitish
            draft = $finalRelease.draft
            prerelease = $finalRelease.prerelease
            immutable = $finalRelease.immutable
            assets = @($finalRelease.assets | Sort-Object name | ForEach-Object {
              [ordered]@{
                id = $_.id
                name = $_.name
                size = $_.size
                digest = $_.digest
                state = $_.state
              }
            })
          } | ConvertTo-Json -Depth 6 -Compress
          $initialSnapshot = (Get-Content -Raw -Encoding UTF8 -LiteralPath $env:FROZEN_RELEASE_SNAPSHOT).Trim()
          if ($finalSnapshot -cne $initialSnapshot) {
            throw "BLOCKED: final immutable release snapshot differs from the pre-download snapshot."
          }

          git fetch --no-tags origin "+refs/heads/main:refs/remotes/origin/main"
          if ($LASTEXITCODE -ne 0) { throw "Unable to refresh authoritative origin/main." }
          $finalMainCommit = (git rev-parse --verify "refs/remotes/origin/main^{commit}").Trim().ToLowerInvariant()
          if ($finalMainCommit -cne $env:RELEASE_TAG_COMMIT_SHA) {
            throw "BLOCKED: origin/main changed after local verification."
          }
          Write-Output "final_remote_revalidation=PASS tag_object=$env:RELEASE_TAG_OBJECT_SHA peel=$env:RELEASE_TAG_COMMIT_SHA"
