name: Full CI

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: full-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  full-ci:
    name: full-ci (Python 3.12)
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install -r requirements-dev.txt

      - name: Run tests
        run: python -m pytest -q -p no:cacheprovider

  compatibility-quick:
    name: compatibility-quick (Python 3.11)
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'

      - name: Install runtime dependencies
        run: |
          python -m pip install -r requirements.txt
          python -m pip install pytest==9.0.2

      - name: Run focused compatibility signal
        run: |
          python -c "import Container_Audit, update_service; print('python311_compatibility=PASS')"
          python -m pytest -q -p no:cacheprovider tests/test_release_version.py tests/test_release_config.py
